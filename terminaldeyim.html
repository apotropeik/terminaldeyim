<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Terminaldeyim</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f5f5f7;
  margin:0;
  padding:20px;
  max-width:700px;
  margin:auto;
}

h1{
  margin-bottom:4px;
}

.sub{
  opacity:.6;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:16px;
  border-radius:18px;
  margin-bottom:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

input,button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:16px;
  box-sizing:border-box;
}

button{
  background:black;
  color:white;
  border:none;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.muted{
  opacity:.6;
  font-size:14px;
}

.entry{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.entry:last-child{
  border-bottom:none;
}

.overlap{
  background:#fff8e7;
  padding:10px;
  border-radius:12px;
  margin-top:10px;
}
</style>
</head>

<body>

<h1>Terminaldeyim</h1>
<div class="sub">Kim, ne zaman, ne kadar müsait?</div>

<div class="card">

<input id="name" placeholder="İsim">

<input id="terminal" placeholder="Terminal / Lounge / Gate">

<input id="start" type="datetime-local">

<input id="duration" type="number" placeholder="Kaç dakika müsaitsin?">

<input id="note" placeholder="Not (opsiyonel)">

<button onclick="saveEntry()">Kaydet</button>

<div id="msg" class="muted"></div>

</div>

<div class="card">
<h3>Aktif Olanlar</h3>
<div id="list"></div>
</div>

<div class="card">
<h3>Çakışmalar</h3>
<div id="overlaps"></div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby4UxHjaW9-rXiaavhWbgcaunJXzAic3isZK-KBbDgDUtDlUodbcLtWHR0vyLMT17Y8/exec";

function formatDate(iso){
  const d = new Date(iso);

  return d.toLocaleString("tr-TR",{
    hour:"2-digit",
    minute:"2-digit",
    day:"2-digit",
    month:"2-digit"
  });
}

async function saveEntry(){

  const name = document.getElementById("name").value.trim();
  const terminal = document.getElementById("terminal").value.trim();
  const start = document.getElementById("start").value;
  const duration = document.getElementById("duration").value;
  const note = document.getElementById("note").value.trim();

  if(!name || !start || !duration){
    document.getElementById("msg").innerText =
      "İsim, saat ve süre gerekli.";
    return;
  }

  const payload = {
    action:"add",
    name:name,
    terminal:terminal,
    start_at:new Date(start).toISOString(),
    duration_min:Number(duration),
    note:note
  };

  const res = await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify(payload)
  });

  const data = await res.json();

  if(data.ok){
    document.getElementById("msg").innerText =
      "Kaydedildi 👍";

    loadEntries();
  } else {
    document.getElementById("msg").innerText =
      "Hata oluştu.";
  }
}

async function loadEntries(){

  const res = await fetch(API_URL + "?action=list");
  const data = await res.json();

  const list = document.getElementById("list");
  const overlaps = document.getElementById("overlaps");

  list.innerHTML = "";
  overlaps.innerHTML = "";

  const entries = data.data || [];

  entries.forEach(e => {

    const div = document.createElement("div");

    div.className = "entry";

    div.innerHTML = `
      <b>${e.name}</b>
      ${e.terminal ? " - " + e.terminal : ""}
      <div class="muted">
        ${formatDate(e.start_at)}
        →
        ${formatDate(e.end_at)}
      </div>
      ${e.note ? `<div>${e.note}</div>` : ""}
    `;

    list.appendChild(div);
  });

  for(let i=0;i<entries.length;i++){

    for(let j=i+1;j<entries.length;j++){

      const a = entries[i];
      const b = entries[j];

      const startA = new Date(a.start_at).getTime();
      const endA = new Date(a.end_at).getTime();

      const startB = new Date(b.start_at).getTime();
      const endB = new Date(b.end_at).getTime();

      const overlapStart = Math.max(startA,startB);
      const overlapEnd = Math.min(endA,endB);

      if(overlapStart < overlapEnd){

        const mins =
          Math.round((overlapEnd - overlapStart)/60000);

        const div = document.createElement("div");

        div.className = "overlap";

        div.innerHTML =
          `<b>${a.name}</b> ↔ <b>${b.name}</b><br>
          ${mins} dk çakışma`;

        overlaps.appendChild(div);
      }
    }
  }

  if(!overlaps.innerHTML){
    overlaps.innerHTML =
      `<div class="muted">Şimdilik çakışma yok.</div>`;
  }
}

loadEntries();

setInterval(loadEntries,30000);

</script>

</body>
</html>
